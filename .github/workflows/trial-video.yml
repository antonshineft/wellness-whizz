# Renders the waiting trial reels of one video (src/trials.ts, video/trials.py). A daily batch is three tests over the
# kept clips: a new opening shot (one clip is drawn), the Google voice, and a short cut. A manual run with a slug posts nothing; the
# scheduled run schedules its three reels through the site (TRIALS_AUTO in wrangler.jsonc switches that off).
name: Trial video

on:
  # The daily loop: yesterday's video gets three variations, scheduled for the same day. GitHub starts this repository's
  # scheduled runs hours late and drops most of them (the 07:40 run of 10 Nov started at 15:45, that of 11 Nov never
  # did), so the loop is asked for every hour of the morning. The first run that starts does the work; the others find
  # the video already has its trials and stop within seconds.
  schedule:
    - cron: '40 6-13 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Video slug whose waiting trials to render (nothing is posted). Empty: run the daily loop now.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: trial-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install
        run: |
          timeout 180 pip install -q -r video/requirements.txt
          # the listener that times the words of the Google voice for the captions; without it they are spread by length
          timeout 240 pip install -q faster-whisper==1.1.1 || echo "faster-whisper not installed: captions of the Google voice will be timed by length"
      - name: Sign in to Google Cloud (Vertex AI, only when a service account is configured)
        env:
          HAS_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CREDENTIALS_JSON != '' }}
        if: env.HAS_SERVICE_ACCOUNT == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      - name: Render the trials
        env:
          WW_ORIGIN: https://aiww.io
          WW_STATS_KEY: ${{ secrets.WW_STATS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE: ${{ vars.ELEVENLABS_VOICE }}
          # one test of a batch draws a new opening scene and one is spoken by a Google voice
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_VERTEX_PROJECT: ${{ secrets.GOOGLE_VERTEX_PROJECT }}
          GOOGLE_GCS_BUCKET: ${{ vars.GOOGLE_GCS_BUCKET }}
          GOOGLE_TTS_VOICE: ${{ vars.GOOGLE_TTS_VOICE }}
          VIDEO_MODEL: ${{ vars.VIDEO_MODEL }}
          VIDEO_RESOLUTION: ${{ vars.VIDEO_RESOLUTION }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIAL_SLUG: ${{ github.event.inputs.slug }}
        run: python video/trials.py "$TRIAL_SLUG"

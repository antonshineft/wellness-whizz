# Renders the waiting trial reels of one video (src/trials.ts, video/trials.py): the kept clips with one narration line
# changed. No footage is generated, so a run costs only the narration. A manual run with a slug posts nothing; the
# scheduled run schedules its three reels through the site (TRIALS_AUTO in wrangler.jsonc switches that off).
name: Trial video

on:
  # The daily loop: yesterday's video gets three variations, scheduled for the same day. GitHub starts this repository's
  # scheduled runs hours late and drops most of them (the 07:40 run of 10 Nov started at 15:45, that of 11 Nov never
  # did), so the loop is asked for every hour of the morning. The first run that starts does the work; the others find
  # the video already has its trials and stop within seconds.
  schedule:
    - cron: '40 6-13 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Video slug whose waiting trials to render (nothing is posted). Empty: run the daily loop now.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: trial-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install
        run: timeout 180 pip install -q -r video/requirements.txt
      - name: Render the trials
        env:
          WW_ORIGIN: https://aiww.io
          WW_STATS_KEY: ${{ secrets.WW_STATS_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE: ${{ vars.ELEVENLABS_VOICE }}
          VIDEO_RESOLUTION: ${{ vars.VIDEO_RESOLUTION }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRIAL_SLUG: ${{ github.event.inputs.slug }}
        run: python video/trials.py "$TRIAL_SLUG"

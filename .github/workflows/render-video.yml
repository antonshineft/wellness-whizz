# Renders the next queued short video (see video/render.py and src/videos.ts) and publishes it as a release asset.
# Runs every three hours; each run asks the site for one job and exits in seconds when there is none.
name: Render video

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Article slug to render (default: the oldest scripted job)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: render-video
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: video/requirements.txt
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q -r video/requirements.txt
      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-base-en-v1
      - name: Render
        env:
          WW_ORIGIN: https://aiww.io
          WW_STATS_KEY: ${{ secrets.WW_STATS_KEY }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JOB_SLUG: ${{ github.event.inputs.slug }}
        run: python video/render.py
      - name: Keep the work files for a week
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-work
          path: video/work
          retention-days: 7
          if-no-files-found: ignore
